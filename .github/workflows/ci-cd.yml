name: GuardianAI Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1: LINT & CODE QUALITY
  lint:
    name: Linting & Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run Flake8 Linter
        run: flake8 backend/app --max-line-length=120 --ignore=E203,W503

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit

  # JOB 2: AUTOMATED TESTING & COVERAGE
  test:
    name: Pytest & Automated Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov

      - name: Run Pytest Suite with Coverage
        run: |
          python -m pytest backend/tests --cov=backend/app --cov-report=term-missing

  # JOB 3: SECURITY VULNERABILITY AUDIT
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit Python Security Scan
        run: |
          pip install bandit
          bandit -r backend/app -ll

      - name: Run NPM Security Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

  # JOB 4: DOCKER IMAGE BUILD & REGISTRY PUSH
  docker-build:
    name: Multi-Stage Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test, security-audit]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest

  # JOB 5: PRODUCTION ZERO-DOWNTIME DEPLOYMENT
  deploy:
    name: Production Deployment Trigger
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Kubernetes Rolling Update
        run: |
          echo "Triggering zero-downtime rolling update deployment to Kubernetes production cluster..."

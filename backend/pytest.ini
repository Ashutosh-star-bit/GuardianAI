# GuardianAI Pytest Configuration
# Purpose: Defines Pytest execution parameters, test discovery paths, coverage thresholds, and asyncio settings.

[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -v
    --cov=app
    --cov-report=term-missing
    --cov-report=html:coverage_html

markers =
    unit: Fast unit tests with no external dependencies
    integration: Integration tests requiring database or API client
    slow: Tests executing extensive AI calculations

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

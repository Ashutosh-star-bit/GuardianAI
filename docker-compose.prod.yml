version: '3.8'

services:
  # 1. Reverse Proxy & Edge Nginx
  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: guardianai-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - guardianai-prod-net
    restart: always

  # 2. React Frontend SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: guardianai-frontend-prod
    environment:
      - VITE_API_BASE_URL=https://api.guardianai.io
    networks:
      - guardianai-prod-net
    restart: always

  # 3. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: guardianai-backend-prod
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://guardian_user:SecurePass123!@postgres:5432/guardian_ai_prod
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=prod_super_secret_jwt_key_9988776655
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - guardianai-prod-net
    restart: always

  # 4. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: guardianai-postgres-prod
    environment:
      POSTGRES_USER: guardian_user
      POSTGRES_PASSWORD: SecurePass123!
      POSTGRES_DB: guardian_ai_prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian_user -d guardian_ai_prod"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - guardianai-prod-net
    restart: always

  # 5. Redis 7 Caching & Rate Limiting Engine
  redis:
    image: redis:7-alpine
    container_name: guardianai-redis-prod
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - guardianai-prod-net
    restart: always

networks:
  guardianai-prod-net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:

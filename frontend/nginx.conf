# ==============================================================================
# GuardianAI Production Nginx Reverse Proxy & Security Configuration
# Features:
#   - TLS 1.3 Encryption & HSTS Security Headers
#   - Gzip Level 6 Compression
#   - Static Asset Immutable Caching (1 Year)
#   - API Reverse Proxy (/api/v1/) to FastAPI Backend
#   - Nginx Rate Limiting (limit_req_zone)
# ==============================================================================

# Rate Limiting Zone: 10MB zone supporting ~160k IPs, 100 req/min limit
limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth_limit_zone:10m rate=20r/m;

server {
    listen 80;
    server_name guardianai.io api.guardianai.io localhost;

    # Redirect HTTP to HTTPS in production
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name guardianai.io api.guardianai.io localhost;

    # SSL / TLS 1.3 Hardened Configurations
    ssl_certificate /etc/ssl/certs/guardianai.crt;
    ssl_certificate_key /etc/ssl/certs/guardianai.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Production Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.guardianai.io;" always;

    # Gzip Level 6 Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/x-javascript
        text/css
        text/javascript
        text/plain
        text/xml;

    # 1. API Gateway Proxy Controller
    location /api/ {
        limit_req zone=api_limit_zone burst=30 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 2. Strict Auth Endpoint Rate Limiting
    location /api/v1/auth/ {
        limit_req zone=auth_limit_zone burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Static Assets Immutable Caching
    location /assets/ {
        proxy_pass http://frontend:80;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 4. React Single Page Application Route Fallback
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
